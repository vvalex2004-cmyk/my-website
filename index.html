<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Важнейший тег для мобильной адаптивности -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый сайт</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка сайта -->
    <header class="header">
        <div class="container">
            <div class="logo">МойСайт</div>
            <nav class="nav">
                <a href="#about">Обо мне</a>
                <a href="#projects">Проекты</a>
                <a href="#contacts">Контакты</a>
            </nav>
        </div>
    </header>

    <!-- Главный баннер -->
    <section class="hero">
        <div class="container">
            <h1>Привет! Я создаю свой веб-сайт</h1>
            <p>Этот сайт отлично выглядит как на ноутбуке, так и на смартфоне.</p>
            <button id="btn">Нажми меня</button>
        </div>
    </section>

    <!-- Блок с карточками -->
    <section class="projects" id="projects">
        <div class="container">
            <h2>Мои блоки</h2>
            <div class="grid">
                <div class="card">
                    <h3>Блок 1</h3>
                    <p>Описание первого элемента.</p>
                </div>
                <div class="card">
                    <h3>Блок 2</h3>
                    <p>Описание второго элемента.</p>
                </div>
                <div class="card">
                    <h3>Блок 3</h3>
                    <p>Описание третьего элемента.</p>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
